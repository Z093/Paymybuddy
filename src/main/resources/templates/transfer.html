<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transfert - Pay My Buddy</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/transfer.css}">
</head>
<body>

<header>
    <nav>
        <span class="logo">Pay My Buddy</span>
        <a href="transfer" class="active">Transférer</a>
        <a href="profile">Profil</a>
        <a href="add">Ajouter relation</a>
        <a href="logout">Se déconnecter</a>
    </nav>
</header>

<div class="transfer-container">


    <form th:action="@{/api/v1/transfer}" method="post" >
        <select name="receiverId" required>
            <option value="" disabled selected>Sélectionner une relation</option>
            <option th:each="friend : ${friends}" th:value="${friend.id}" th:text="${friend.username}"></option>
        </select>


        <input type="text" name="description" placeholder="Description" required>

        <input type="number" name="amount" min="0" step="0.01" placeholder="0€" required>

        <button type="submit">Payer</button>
    </form>

    <h3>Mes Transactions</h3>
    <table>
        <thead>
        <tr>
            <th>Relations</th>
            <th>Description</th>
            <th>Montant</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="transaction : ${transactions}">
            <td th:text="${transaction.receiverName}"></td>
            <td th:text="${transaction.description}"></td>
            <td th:text="${transaction.amount} + '€'"></td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
